# Dokploy → Compose (Docker Compose). Postgres здесь НЕ поднимается:
# он создаётся отдельным сервисом Database → PostgreSQL в том же проекте Dokploy.
services:
  kodik-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      # Postgres из проекта Dokploy: хост = "Internal Host" сервиса БД
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in Dokploy Environment}

      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?set S3_PUBLIC_URL}

      KODIK_TOKEN: ${KODIK_TOKEN:?set KODIK_TOKEN}
      KODIK_TRANSLATION_ID: ${KODIK_TRANSLATION_ID:-609}
      KODIK_LIMIT: ${KODIK_LIMIT:-100}
      KODIK_DELAY: ${KODIK_DELAY:-0.25}
      KODIK_TIMEOUT: ${KODIK_TIMEOUT:-60}
      KODIK_RETRIES: ${KODIK_RETRIES:-5}
    volumes:
      - kodik_data:/app/data
    networks:
      - dokploy-network

volumes:
  kodik_data:

networks:
  dokploy-network:
    external: true
